    const { Transformer } = window.markmap;
    const transformer = new Transformer();
    const { root } = transformer.transform(markdown);

    const DOMAIN = {
      root: '#60a5fa',
      foundations: '#a3a3a3',
      theory: '#60a5fa',
      systems: '#4ade80',
      software: '#fb923c',
      ai: '#c084fc',
      apps: '#f472b6',
    };

    function clean(t) { return (t || '').replace(/<[^>]*>/g, '').trim(); }

    function assignDomainColors(node, domainColor) {
      const content = clean(node.content || node.data?.content);
      let color = domainColor;
      if (!domainColor) {
        if (content === 'Computer Science' || (node.state && node.state.depth === 0))
          color = DOMAIN.root;
      }
      if (content === 'Foundations' || content.startsWith('Foundations')) color = DOMAIN.foundations;
      else if (content === 'Theoretical CS' || content.startsWith('Theoretical')) color = DOMAIN.theory;
      else if (content === 'Computer Systems' || content.startsWith('Computer Systems')) color = DOMAIN.systems;
      else if (content === 'Software & Programming' || content.startsWith('Software')) color = DOMAIN.software;
      else if (content === 'AI, ML & Data Science' || content.startsWith('AI')) color = DOMAIN.ai;
      else if (content === 'Specialized' || content.startsWith('Specialized')) color = DOMAIN.apps;
      node._color = color || domainColor || DOMAIN.root;
      (node.children || []).forEach(c => assignDomainColors(c, node._color));
    }
    assignDomainColors(root, null);

    const { Markmap } = window.markmap;
    const mm = Markmap.create('#mindmap', {
      autoFit: true,
      duration: 350,
      maxWidth: 210,
      color: n => n._color || DOMAIN.root,
      paddingX: 8,
      spacingVertical: 4,
      spacingHorizontal: 55,
    }, root);

    setTimeout(() => {
      document.querySelectorAll('.markmap-link').forEach(el => el.setAttribute('stroke-opacity', '0.5'));
    }, 200);

    function collapseToDepth(depth) {
      function walk(node, d) {
        if (d >= depth && node.children) {
          node.payload = node.payload || {};
          node.payload.fold = true;
        }
        (node.children || []).forEach(c => walk(c, d + 1));
      }
      walk(root, 0);
      mm.setData(root);
      mm.fit();
      setTimeout(() => {
        document.querySelectorAll('.markmap-link').forEach(el => el.setAttribute('stroke-opacity', '0.5'));
      }, 50);
    }

    setTimeout(() => collapseToDepth(1), 150);

    window.fit = () => mm.fit();
    window.expandAll = () => {
      function walk(node) {
        if (node.payload) node.payload.fold = false;
        (node.children || []).forEach(walk);
      }
      walk(root);
      mm.setData(root);
      mm.fit();
      setTimeout(() => {
        document.querySelectorAll('.markmap-link').forEach(el => el.setAttribute('stroke-opacity', '0.5'));
      }, 50);
    };
    window.collapseAll = () => collapseToDepth(1);
  </script>
